<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de grupo Roblox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --papel: #e7eceF;
  --tinta: #14202b;
  --suave: #566775;
  --linha: #c3cdd4;
  --fundo-linha: #dce3e8;
  --cobalto: #2b4bff;
  --ambar: #a96a0c;
  --verde: #137a65;
  --vermelho: #b83227;
  --titulo: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --texto: "Source Sans 3", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --papel: #121a22;
    --tinta: #e6edf2;
    --suave: #8fa1af;
    --linha: #2c3a46;
    --fundo-linha: #1a2530;
    --cobalto: #7d92ff;
    --ambar: #e0a24a;
    --verde: #4fc6a9;
    --vermelho: #ef7b6f;
  }
}
* { box-sizing: border-box; }
html { background: var(--papel); }
body {
  margin: 0;
  color: var(--tinta);
  font-family: var(--texto);
  font-size: 17px;
  line-height: 1.5;
}
a { color: inherit; }
button {
  font: inherit;
  color: var(--tinta);
  background: transparent;
  border: 2px solid var(--tinta);
  padding: 8px 16px;
  cursor: pointer;
}
button:hover:not(:disabled) { background: var(--tinta); color: var(--papel); }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--cobalto); outline-offset: 2px; }

.pagina {
  max-width: 1180px;
  margin: 0 auto;
  padding: 40px 24px 80px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 56px;
}
.topo { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; }
.hero-numero {
  font-family: var(--titulo);
  font-weight: 800;
  font-size: clamp(72px, 14vw, 156px);
  line-height: .9;
  letter-spacing: -.03em;
}
.hero-rotulo { color: var(--suave); margin-top: 8px; }
.hero-spark { width: min(420px, 100%); height: 64px; }
.controles { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--suave); }

.busca { grid-column: 1 / -1; margin-top: -16px; padding-top: 24px; border-top: 2px solid var(--tinta); }
.busca label { display: block; font-weight: 600; margin-bottom: 6px; }
.busca-linha { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.busca input {
  font-family: var(--titulo);
  font-size: 24px;
  font-weight: 500;
  color: var(--tinta);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--tinta);
  border-radius: 0;
  padding: 6px 2px;
  min-width: 240px;
}
.busca input::placeholder { color: var(--suave); }
.busca-info { margin-top: 14px; font-family: var(--titulo); font-size: 20px; font-weight: 500; }
.busca-aviso { color: var(--suave); font-size: 15px; margin-top: 2px; max-width: 70ch; }

h2 { font-family: var(--titulo); font-weight: 800; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.01em; }

.jogo { padding-top: 32px; margin-top: 32px; border-top: 2px solid var(--tinta); }
.jogo:first-child { margin-top: 0; }
.jogo-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
.jogo-meta { color: var(--suave); margin-top: 4px; }
.jogo-numeros { display: flex; gap: 32px; align-items: flex-end; }
.numero-g { font-family: var(--titulo); font-weight: 800; font-size: 40px; line-height: 1; }
.numero-rotulo { color: var(--suave); font-size: 15px; }
.jogo-spark { width: 160px; height: 40px; display: block; margin-top: 6px; }

.places { margin-top: 20px; }
.place { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--linha); }
.place img, .place .sem-img { width: 72px; height: 72px; object-fit: cover; background: var(--fundo-linha); display: block; }
.place-nome { font-weight: 600; }
.place-sub { color: var(--suave); font-size: 15px; overflow-wrap: anywhere; }
.place-data { text-align: right; font-size: 15px; color: var(--suave); }
.place-data strong { color: var(--tinta); font-weight: 600; margin-left: 6px; }
.jogo-visita { margin-top: 14px; color: var(--suave); }
.jogo-visita strong { color: var(--tinta); font-weight: 600; }

.erro { margin: 16px 0 0; padding: 12px 14px; border-left: 4px solid var(--vermelho); background: var(--fundo-linha); }

.feed { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow: auto; }
.feed ol { list-style: none; margin: 20px 0 0; padding: 0 0 0 20px; border-left: 2px solid var(--linha); }
.feed li { position: relative; padding: 0 0 22px; }
.feed li::before {
  content: "";
  position: absolute;
  left: -27px; top: 7px;
  width: 12px; height: 12px;
  background: var(--cor, var(--suave));
  border: 3px solid var(--papel);
  border-radius: 50%;
}
.ev-texto { font-weight: 600; }
.ev-sub { color: var(--suave); font-size: 15px; }
.vazio { color: var(--suave); margin-top: 16px; }

@media (max-width: 900px) {
  .pagina { grid-template-columns: 1fr; gap: 40px; padding: 24px 16px 64px; }
  .feed { position: static; max-height: none; }
  .place { grid-template-columns: 56px 1fr; }
  .place img, .place .sem-img { width: 56px; height: 56px; }
  .place-data { grid-column: 2; text-align: left; }
  .busca input { min-width: 0; flex: 1 1 200px; }
}
@media (prefers-reduced-motion: no-preference) {
  .hero-numero { transition: opacity .3s; }
}
</style>
</head>
<body>
<main class="pagina">
  <header class="topo">
    <div>
      <div class="hero-numero" id="total">–</div>
      <div class="hero-rotulo">Jogadores online agora no grupo</div>
    </div>
    <svg class="hero-spark" id="total-spark" viewBox="0 0 420 64" preserveAspectRatio="none" role="img" aria-label="Variação de jogadores online"></svg>
    <div class="controles">
      <span id="status">Carregando…</span>
    </div>
  </header>

  <section class="busca" aria-label="Escolher grupo">
    <label for="grupo-id">ID do grupo</label>
    <div class="busca-linha">
      <input id="grupo-id" type="text" inputmode="numeric" autocomplete="off" placeholder="Ex.: 4165692">
      <button id="inspecionar" type="button">Inspecionar</button>
      <button id="voltar" type="button" hidden>Voltar ao grupo monitorado</button>
      <button id="atualizar" type="button" hidden>Consultar de novo</button>
    </div>
    <div class="busca-info" id="grupo-info"></div>
    <div class="busca-aviso" id="aviso"></div>
  </section>

  <section id="jogos" aria-label="Jogos do grupo"></section>

  <aside class="feed" aria-label="Mudanças detectadas">
    <h2>Mudanças detectadas</h2>
    <div id="feed"></div>
  </aside>
</main>

<script>
const PROXY = "roproxy.com";
const CHAVE_LS = "monitor:";
const MAX_EVENTOS = 200;
const MAX_HISTORICO = 288;
const INTERVALO_AO_VIVO = 300000;

const CORES = {
  patch: "var(--cobalto)",
  nome: "var(--ambar)",
  descricao: "var(--suave)",
  "place+": "var(--verde)",
  "place-": "var(--vermelho)"
};

let dadosFixos = null;
let grupoPadrao = null;
let grupoAtivo = null;
let modoAoVivo = false;
let token = 0;
let timerAoVivo = null;

function el(id) {
  return document.getElementById(id);
}

function esc(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function numero(n) {
  if (n === null || n === undefined) return "–";
  return Number(n).toLocaleString("pt-BR");
}

function pausa(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function formatarData(texto) {
  if (!texto) return null;
  const d = new Date(texto);
  if (isNaN(d)) return texto;
  return d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" }).replace(",", "");
}

function textoAgora() {
  return formatarData(new Date().toISOString());
}

function spark(serie, largura, altura) {
  if (!serie || serie.length < 2) return "";
  const valores = serie.map(p => p[1]);
  const min = Math.min(...valores);
  const max = Math.max(...valores);
  const faixa = max - min || 1;
  const pontos = serie.map((p, i) => {
    const x = (i / (serie.length - 1)) * largura;
    const y = altura - 4 - ((p[1] - min) / faixa) * (altura - 8);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return `<polyline points="${pontos}" fill="none" stroke="var(--cobalto)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
}

function somarSeries(jogos) {
  const mapa = new Map();
  jogos.forEach(j => (j.historico || []).forEach(([t, n]) => {
    const chave = Math.round(t / 300);
    mapa.set(chave, (mapa.get(chave) || 0) + n);
  }));
  return [...mapa.entries()].sort((a, b) => a[0] - b[0]).map(([t, n]) => [t, n]);
}

async function buscar(sub, caminho, tentativas = 2) {
  const res = await fetch(`https://${sub}.${PROXY}${caminho}`, { cache: "no-store" });
  if (res.status === 429 && tentativas > 1) {
    await pausa(1500);
    return buscar(sub, caminho, tentativas - 1);
  }
  if (!res.ok) {
    const erro = new Error("HTTP " + res.status);
    erro.status = res.status;
    throw erro;
  }
  return res.json();
}

function lerLS(grupo) {
  const base = { places: {}, universos: {}, eventos: [], historico: {}, visitas: {} };
  try {
    const bruto = localStorage.getItem(CHAVE_LS + grupo);
    if (!bruto) return { ...base, existia: false };
    return { ...base, ...JSON.parse(bruto), existia: true };
  } catch {
    return { ...base, existia: false };
  }
}

function salvarLS(grupo, estado) {
  try {
    const { existia, ...resto } = estado;
    localStorage.setItem(CHAVE_LS + grupo, JSON.stringify(resto));
  } catch {}
}

async function buscarIcones(ids) {
  const mapa = {};
  if (!ids.length) return mapa;
  try {
    const r = await buscar("thumbnails", `/v1/places/gameicons?placeIds=${ids.join(",")}&returnPolicy=PlaceHolder&size=512x512&format=Png&isCircular=false`);
    (r.data || []).forEach(i => { mapa[i.targetId] = i.imageUrl; });
  } catch {}
  return mapa;
}

async function detalharPlace(place, icones) {
  const resultado = {
    id: place.id,
    nome: place.name || "Unnamed",
    descricao: "",
    criado: null,
    atualizado: null,
    imagem: icones[place.id] || null,
    rawUpdated: null,
    ok: false
  };
  try {
    const d = await buscar("economy", `/v2/assets/${place.id}/details`);
    resultado.nome = d.Name || resultado.nome;
    resultado.descricao = d.Description || "";
    resultado.criado = formatarData(d.Created);
    resultado.atualizado = formatarData(d.Updated);
    resultado.rawUpdated = d.Updated || null;
    resultado.ok = true;
  } catch {}
  return resultado;
}

async function coletarAoVivo(grupo) {
  let lista;
  try {
    lista = await buscar("games", `/v2/groups/${grupo}/games?accessFilter=All&limit=100`);
  } catch (e) {
    if (e.status === 400 || e.status === 404) throw new Error("Grupo não encontrado. Confira o ID.");
    throw new Error("Não foi possível consultar o Roblox agora (" + e.message + "). Tente de novo em instantes.");
  }

  const jogos = lista.data || [];
  const estado = lerLS(grupo);
  const eventos = estado.eventos;
  const agora = textoAgora();
  const registrar = (tipo, texto, jogo) => {
    eventos.unshift({ quando: agora, tipo, texto, jogo });
    if (eventos.length > MAX_EVENTOS) eventos.length = MAX_EVENTOS;
  };

  const stats = {};
  if (jogos.length) {
    try {
      const r = await buscar("games", `/v1/games?universeIds=${jogos.map(j => j.id).join(",")}`);
      (r.data || []).forEach(i => { stats[i.id] = i; });
    } catch {}
  }

  const resultado = [];
  for (const jogo of jogos) {
    const s = stats[jogo.id] || {};
    const serie = estado.historico[jogo.id] || (estado.historico[jogo.id] = []);
    if (s.playing !== undefined) {
      serie.push([Math.floor(Date.now() / 1000), s.playing]);
      if (serie.length > MAX_HISTORICO) serie.splice(0, serie.length - MAX_HISTORICO);
    }

    const registroV = estado.visitas[jogo.id] || {};
    let ultimaVisita = registroV.ultima || null;
    let novasVisitas = registroV.novas || null;
    if (s.visits !== undefined) {
      if (registroV.visitas !== undefined && s.visits > registroV.visitas) {
        ultimaVisita = agora;
        novasVisitas = s.visits - registroV.visitas;
      }
      estado.visitas[jogo.id] = { visitas: s.visits, ultima: ultimaVisita, novas: novasVisitas };
    }

    const item = {
      id: jogo.id,
      nome: jogo.name,
      jogando: s.playing ?? null,
      visitas: s.visits ?? null,
      historico: serie,
      ultima_visita: ultimaVisita,
      ultima_visita_novas: novasVisitas,
      places: [],
      erro: null
    };

    try {
      const r = await buscar("develop", `/v1/universes/${jogo.id}/places?limit=100`);
      const places = r.data || [];
      const icones = await buscarIcones(places.map(p => p.id));
      const detalhes = await Promise.all(places.map(p => detalharPlace(p, icones)));

      detalhes.forEach(d => {
        const chave = String(d.id);
        const anterior = estado.places[chave];
        if (d.ok) {
          if (anterior) {
            if (d.rawUpdated && anterior.updated !== d.rawUpdated) registrar("patch", `Novo patch em ${d.nome}`, jogo.name);
            if (anterior.name !== d.nome) registrar("nome", `Nome mudou de "${anterior.name}" para "${d.nome}"`, jogo.name);
            if (anterior.description !== d.descricao) registrar("descricao", `Descrição de ${d.nome} foi alterada`, jogo.name);
          }
          estado.places[chave] = { updated: d.rawUpdated, name: d.nome, description: d.descricao };
        }
        item.places.push({
          id: d.id,
          nome: d.nome,
          descricao: d.descricao,
          criado: d.criado,
          atualizado: d.atualizado,
          imagem: d.imagem
        });
      });

      const atuais = places.map(p => String(p.id));
      const anteriores = estado.universos[jogo.id];
      if (anteriores) {
        atuais.filter(pid => !anteriores.includes(pid)).forEach(pid => registrar("place+", `Place ${pid} adicionado ao universo`, jogo.name));
        anteriores.filter(pid => !atuais.includes(pid)).forEach(pid => registrar("place-", `Place ${pid} removido do universo`, jogo.name));
      }
      estado.universos[jogo.id] = atuais;
    } catch (e) {
      item.erro = "Não foi possível ler os places (" + e.message + ")";
    }

    resultado.push(item);
    await pausa(300);
  }

  salvarLS(grupo, estado);

  return {
    jogos: resultado,
    atualizado_em: agora,
    erro: null,
    grupo: grupo,
    eventos: eventos,
    primeiraConsulta: !estado.existia
  };
}

function renderPlace(p) {
  const img = p.imagem ? `<img src="${esc(p.imagem)}" alt="" loading="lazy">` : `<div class="sem-img"></div>`;
  return `
    <div class="place">
      ${img}
      <div>
        <div class="place-nome">${esc(p.nome)}</div>
        <div class="place-sub">ID ${esc(p.id)}</div>
      </div>
      <div class="place-data">
        <div>Último patch <strong>${esc(p.atualizado || "Sem dados")}</strong></div>
        <div>Criado em <strong>${esc(p.criado || "Sem dados")}</strong></div>
      </div>
    </div>`;
}

function renderJogo(j) {
  const places = j.places.map(renderPlace).join("");
  const erro = j.erro ? `<p class="erro">${esc(j.erro)}</p>` : "";
  const novas = j.ultima_visita_novas ? ` (+${numero(j.ultima_visita_novas)} ${j.ultima_visita_novas === 1 ? "visita" : "visitas"} nessa checagem)` : "";
  const visita = j.ultima_visita
    ? `<div class="jogo-visita">Última entrada detectada: <strong>${esc(j.ultima_visita)}</strong>${novas}</div>`
    : `<div class="jogo-visita">Última entrada detectada: nenhuma desde que o monitoramento começou</div>`;
  return `
    <article class="jogo">
      <div class="jogo-cab">
        <div>
          <h2>${esc(j.nome)}</h2>
          <div class="jogo-meta">Universe ID ${esc(j.id)} · ${j.places.length} ${j.places.length === 1 ? "place" : "places"}</div>
        </div>
        <div class="jogo-numeros">
          <div>
            <div class="numero-g">${numero(j.jogando)}</div>
            <div class="numero-rotulo">jogando agora</div>
            <svg class="jogo-spark" viewBox="0 0 160 40" preserveAspectRatio="none" aria-hidden="true">${spark(j.historico, 160, 40)}</svg>
          </div>
          <div>
            <div class="numero-g">${numero(j.visitas)}</div>
            <div class="numero-rotulo">visitas totais</div>
          </div>
        </div>
      </div>
      ${visita}
      ${erro}
      <div class="places">${places}</div>
    </article>`;
}

function renderFeed(eventos, primeiraConsulta) {
  if (!eventos.length) {
    const texto = primeiraConsulta
      ? "Primeira consulta deste grupo neste navegador. As mudanças aparecem a partir da próxima consulta."
      : "Nenhuma mudança detectada ainda. Novos patches, nomes e descrições aparecem aqui.";
    return `<p class="vazio">${texto}</p>`;
  }
  const itens = eventos.map(e => `
    <li style="--cor:${CORES[e.tipo] || "var(--suave)"}">
      <div class="ev-texto">${esc(e.texto)}</div>
      <div class="ev-sub">${esc(e.jogo)} · ${esc(e.quando)}</div>
    </li>`).join("");
  return `<ol>${itens}</ol>`;
}

function desenhar(d) {
  const total = d.jogos.reduce((s, j) => s + (Number(j.jogando) || 0), 0);
  el("total").textContent = d.jogos.length ? numero(total) : "–";
  el("total-spark").innerHTML = spark(somarSeries(d.jogos), 420, 64);

  if (d.jogos.length) {
    el("jogos").innerHTML = d.jogos.map(renderJogo).join("");
  } else {
    el("jogos").innerHTML = modoAoVivo
      ? `<p class="vazio">Esse grupo não tem jogos públicos.</p>`
      : `<p class="vazio">Aguardando os primeiros dados do grupo ${esc(d.grupo)}.</p>`;
  }

  el("feed").innerHTML = renderFeed(d.eventos || [], d.primeiraConsulta);
  el("voltar").hidden = !(modoAoVivo && dadosFixos);
  el("atualizar").hidden = !modoAoVivo;
  el("atualizar").disabled = false;

  if (d.erro) {
    el("status").textContent = "Erro na última verificação: " + d.erro;
  } else if (!d.atualizado_em) {
    el("status").textContent = "Fazendo a primeira verificação…";
  } else if (modoAoVivo) {
    el("status").textContent = `Consulta ao vivo · atualizado em ${d.atualizado_em}`;
  } else {
    el("status").textContent = `Monitoramento contínuo · atualizado em ${d.atualizado_em}`;
  }

  el("aviso").textContent = modoAoVivo
    ? "Dados consultados direto do Roblox por este navegador, a cada 5 minutos enquanto a página estiver aberta. O gráfico e as mudanças começam agora e ficam salvos só neste navegador."
    : "Este é o grupo monitorado pelo GitHub. As mudanças são detectadas a cada 10 minutos, mesmo com o site fechado.";
}

function mostrarErro(mensagem) {
  el("total").textContent = "–";
  el("total-spark").innerHTML = "";
  el("jogos").innerHTML = `<p class="erro">${esc(mensagem)}</p>`;
  el("feed").innerHTML = "";
  el("status").textContent = "Consulta não concluída";
  el("voltar").hidden = !(modoAoVivo && dadosFixos);
  el("atualizar").hidden = false;
  el("atualizar").disabled = false;
  el("aviso").textContent = "";
}

async function consultar(id) {
  const meu = ++token;
  el("status").textContent = "Consultando o Roblox…";
  el("atualizar").disabled = true;
  try {
    const dados = await coletarAoVivo(id);
    if (meu !== token) return;
    desenhar(dados);
  } catch (e) {
    if (meu !== token) return;
    mostrarErro(e.message);
  }
}

async function carregarNomeGrupo(id) {
  const info = el("grupo-info");
  info.textContent = "Grupo " + id;
  try {
    const r = await buscar("groups", `/v1/groups/${id}`);
    if (String(grupoAtivo) === String(id) && r.name) info.textContent = `${r.name} · ID ${id}`;
  } catch {}
}

function atualizarUrl(id) {
  const url = new URL(location.href);
  if (grupoPadrao !== null && String(id) !== String(grupoPadrao)) {
    url.searchParams.set("grupo", id);
  } else if (grupoPadrao === null) {
    url.searchParams.set("grupo", id);
  } else {
    url.searchParams.delete("grupo");
  }
  history.replaceState(null, "", url);
}

function escolher(valor) {
  const id = String(valor).trim();
  if (!/^\d{1,12}$/.test(id)) {
    el("aviso").textContent = "Digite só números. O ID do grupo aparece no endereço da página do grupo no Roblox.";
    return;
  }

  clearInterval(timerAoVivo);
  timerAoVivo = null;
  el("grupo-id").value = id;
  grupoAtivo = id;
  atualizarUrl(id);
  carregarNomeGrupo(id);

  if (dadosFixos && id === String(grupoPadrao)) {
    token++;
    modoAoVivo = false;
    desenhar(dadosFixos);
    return;
  }

  modoAoVivo = true;
  consultar(id);
  timerAoVivo = setInterval(() => consultar(id), INTERVALO_AO_VIVO);
}

async function recarregarFixos() {
  const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function iniciar() {
  try {
    dadosFixos = await recarregarFixos();
    grupoPadrao = dadosFixos.grupo;
  } catch {
    dadosFixos = null;
    grupoPadrao = null;
  }

  const param = new URLSearchParams(location.search).get("grupo");
  const inicial = param || (dadosFixos ? String(dadosFixos.grupo) : null);

  if (inicial) {
    escolher(inicial);
  } else {
    el("status").textContent = "Digite o ID de um grupo para começar.";
    el("aviso").textContent = "Ainda não há dados do grupo monitorado. Você pode inspecionar qualquer grupo agora.";
  }

  setInterval(async () => {
    if (modoAoVivo) return;
    try {
      dadosFixos = await recarregarFixos();
      grupoPadrao = dadosFixos.grupo;
      if (String(grupoAtivo) === String(grupoPadrao)) desenhar(dadosFixos);
    } catch {}
  }, 60000);
}

el("inspecionar").addEventListener("click", () => escolher(el("grupo-id").value));
el("grupo-id").addEventListener("keydown", e => {
  if (e.key === "Enter") escolher(el("grupo-id").value);
});
el("voltar").addEventListener("click", () => escolher(grupoPadrao));
el("atualizar").addEventListener("click", () => {
  if (grupoAtivo) consultar(grupoAtivo);
});

iniciar();
</script>
</body>
</html>
